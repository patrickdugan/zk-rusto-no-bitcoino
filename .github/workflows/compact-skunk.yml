name: Compact skunk offline probes

on:
  push:
    paths:
      - 'compact-skunk/**'
      - '.github/workflows/compact-skunk.yml'
  pull_request:
    paths:
      - 'compact-skunk/**'
      - '.github/workflows/compact-skunk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline models
        run: python -m unittest discover -s compact-skunk -p 'test_*.py' -v
      - name: Reconcile pinned baseline and generate cut census
        run: python compact-skunk/lab.py --check-upstream . --output compact-skunk/local-results/report.json
