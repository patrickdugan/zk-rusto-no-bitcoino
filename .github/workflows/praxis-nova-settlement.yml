name: praxis-nova-settlement
on:
  pull_request:
    paths:
      - 'integrations/praxis-nova/**'
      - 'integrations/bitvm3-nova/m18/**'
      - '.github/workflows/praxis-nova-settlement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Fixed shape and negative constraints
        run: cargo test --release --manifest-path integrations/praxis-nova/Cargo.toml -- --nocapture
      - name: Native recursive and compressed proof pilot
        run: |
          set -euo pipefail
          mkdir -p /tmp/praxis-nova-pilot
          /usr/bin/time -v cargo run --release --manifest-path integrations/praxis-nova/Cargo.toml -- /tmp/praxis-nova-pilot 2> /tmp/praxis-nova-pilot/resources.txt
          test "$(wc -c < /tmp/praxis-nova-pilot/pns1-stable-statement.bin)" -eq 440
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: praxis-nova-pilot
          path: /tmp/praxis-nova-pilot/
          if-no-files-found: ignore
  direct-nova-bqs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Exact Pasta limb arithmetic replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pns-bqs
          node integrations/praxis-nova/bqs/limb_reference.js > /tmp/pns-bqs/limb-reference.json
          diff -u integrations/praxis-nova/bqs/results/limb-reference.json /tmp/pns-bqs/limb-reference.json
      - name: Gate truth tables and acceptance pins
        run: cargo test --release --manifest-path integrations/praxis-nova/bqs/Cargo.toml
      - name: Native Nova arithmetic and Spartan round BQS differential
        run: |
          set -euo pipefail
          mkdir -p /tmp/pns-bqs
          /usr/bin/time -v cargo run --release --manifest-path integrations/praxis-nova/bqs/Cargo.toml | tee /tmp/pns-bqs/counts.jsonl
      - name: IPA scalar and complete affine group BQS regression
        shell: bash
        run: |
          set -euo pipefail
          node integrations/praxis-nova/bqs/ipa_bqs.js > /tmp/pns-bqs/ipa-components.json
          diff -u integrations/praxis-nova/bqs/results/ipa-bqs-components.json /tmp/pns-bqs/ipa-components.json
      - name: Native IPA proof and fused equation differential
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path integrations/praxis-nova/bqs/Cargo.toml --bin ipa_native -- /tmp/pns-bqs/ipa-native.json
      - name: Actual IPA transcript BQS export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pns-ipa-transcripts
          cargo run --release --manifest-path integrations/praxis-nova/bqs/Cargo.toml --bin ipa_transcript -- /tmp/pns-bqs/ipa-native.json /tmp/pns-ipa-transcripts | tee /tmp/pns-bqs/ipa-transcript-counts.jsonl
      - name: Joint IPA opening BQS positive and adversarial assignment
        shell: bash
        run: |
          set -euo pipefail
          for curve in Pallas Vesta; do
            /usr/bin/time -v node integrations/praxis-nova/bqs/ipa_joint.js /tmp/pns-ipa-transcripts/"$curve" >> /tmp/pns-bqs/ipa-joint.jsonl 2>> /tmp/pns-bqs/ipa-joint-resources.txt
          done
          /usr/bin/time -v node integrations/praxis-nova/bqs/ipa_joint.js /tmp/pns-ipa-transcripts/Pallas --negative >> /tmp/pns-bqs/ipa-joint.jsonl 2>> /tmp/pns-bqs/ipa-joint-resources.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pns-direct-bqs-counts
          path: /tmp/pns-bqs/
          if-no-files-found: ignore
