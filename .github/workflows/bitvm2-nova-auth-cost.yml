name: BitVM2 Nova WOTS verification cost checks
on:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-auth-cost.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-auth-cost.yml']
permissions:
  contents: read
jobs:
  full-width-wots-verification-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      CUDA_VISIBLE_DEVICES: ''
      BITVM2_NOVA_AUTH_COST_TESTS: '1'
    defaults:
      run:
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check closed sources, body provenance and full-width diagnostic domains
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install -r transcript-requirements.txt
          timeout --signal=KILL 60s prlimit --as=268435456 --cpu=60 -- \
            python auth_cost_body_pins.py --check | tee results/auth-cost-body-pins.json
          /usr/bin/time -v -o results/auth-cost-python-time.txt \
            timeout --signal=KILL 480s prlimit --as=268435456 --cpu=480 -- \
            python -m unittest discover -s tests -p 'test_auth_cost*.py' -v \
            2>&1 | tee results/auth-cost-python-tests.txt
      - name: Build isolated candidate and test canonical hints, modes and source admission
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustc --version | tee results/auth-cost-rust-version.txt
          rustfmt --edition 2021 --check auth-cost-oracle/src/*.rs
          cargo generate-lockfile --manifest-path auth-cost-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path rust-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path point-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path scalar-source-oracle/Cargo.toml
          cargo tree --locked --manifest-path auth-cost-oracle/Cargo.toml > results/auth-cost-dependencies.txt
          cargo test --release --locked --manifest-path auth-cost-oracle/Cargo.toml -- --nocapture
          cargo build --release --locked --manifest-path auth-cost-oracle/Cargo.toml --bin auth_cost
      - name: Compare actual leaf scripts and authenticated openings under unchanged limits
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/auth-cost-execution-time.txt \
            timeout --signal=KILL 1500s prlimit --as=536870912 --cpu=1500 -- \
            python bench_auth_cost.py --cases-dir results/auth-cost-cases \
            --native-worker auth-cost-oracle/target/release/auth_cost \
            --output results/auth-cost-conformance.json | tee results/auth-cost-stdout.json
          cat results/auth-cost-execution-time.txt
          cp results/auth-cost-cases/manifest.json results/auth-cost-manifest.json
          sha256sum results/auth-cost-manifest.json results/auth-cost-conformance.json > results/auth-cost-report-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-auth-cost-evidence
          path: |
            integrations/bitvm2-nova/results/auth-cost-*.json
            integrations/bitvm2-nova/results/auth-cost-*.txt
            integrations/bitvm2-nova/auth-cost-oracle/Cargo.lock
            integrations/bitvm2-nova/rust-oracle/Cargo.lock
            integrations/bitvm2-nova/point-oracle/Cargo.lock
            integrations/bitvm2-nova/scalar-source-oracle/Cargo.lock
