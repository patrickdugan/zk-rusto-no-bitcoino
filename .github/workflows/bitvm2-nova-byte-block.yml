name: BitVM2 Nova four-round byte Keccak checks
on:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-byte-block.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-byte-block.yml']
permissions:
  contents: read
jobs:
  byte-block-and-middle-opening-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      CUDA_VISIBLE_DEVICES: ''
    defaults:
      run:
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sealed block topology, three exact BYTE joins and adversarial claims
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install -r transcript-requirements.txt
          /usr/bin/time -v -o results/byte-block-python-time.txt \
            timeout --signal=KILL 480s prlimit --as=268435456 --cpu=480 -- \
            python -m unittest discover -s tests -p 'test_byte_keccak_block*.py' -v \
            2>&1 | tee results/byte-block-python-tests.txt
      - name: Build pinned block worker and run independent topology/admission tests
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustc --version | tee results/byte-block-rust-version.txt
          rustfmt --edition 2021 --check rust-oracle/src/registry.rs rust-oracle/src/bin/byte_keccak_block.rs
          cargo generate-lockfile --manifest-path rust-oracle/Cargo.toml
          cargo tree --locked --manifest-path rust-oracle/Cargo.toml > results/byte-block-dependencies.txt
          cargo test --release --locked --manifest-path rust-oracle/Cargo.toml --lib registry::tests -- --nocapture
          cargo test --release --locked --manifest-path rust-oracle/Cargo.toml --bin byte_keccak_block -- --nocapture
          cargo build --release --locked --manifest-path rust-oracle/Cargo.toml --bin byte_keccak_block
      - name: Execute every parent leaf and verify all middle producer-consumer openings
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/byte-block-execution-time.txt \
            timeout --signal=KILL 1500s prlimit --as=536870912 --cpu=1500 -- \
            python bench_byte_keccak_block.py --cases-dir results/byte-block-cases \
            --native-worker rust-oracle/target/release/byte_keccak_block \
            --output results/byte-block-conformance.json | tee results/byte-block-stdout.json
          cat results/byte-block-execution-time.txt
          cp results/byte-block-cases/manifest.json results/byte-block-manifest.json
          sha256sum results/byte-block-manifest.json results/byte-block-conformance.json > results/byte-block-report-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-byte-block-evidence
          path: |
            integrations/bitvm2-nova/results/byte-block-*.json
            integrations/bitvm2-nova/results/byte-block-*.txt
            integrations/bitvm2-nova/rust-oracle/Cargo.lock
