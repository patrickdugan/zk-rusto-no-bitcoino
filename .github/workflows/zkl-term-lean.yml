name: ZKL typed conversion replay
on:
  pull_request:
    paths:
      - 'integrations/zkl-nova-calibration/typed_export.py'
      - 'integrations/zkl-nova-calibration/term-fixtures.json'
      - '.github/workflows/zkl-term-lean.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/zkl-nova-calibration/typed_export.py'
      - 'integrations/zkl-nova-calibration/term-fixtures.json'
      - '.github/workflows/zkl-term-lean.yml'
permissions:
  contents: read
jobs:
  lean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate typed equality statements
        run: |
          set -euo pipefail
          python integrations/zkl-nova-calibration/typed_export.py --out "$RUNNER_TEMP/TermExamples.lean"
          test "$(sha256sum "$RUNNER_TEMP/TermExamples.lean" | cut -d' ' -f1)" = 5a5112450b212432c3ecd2088fb5694256b417328f58adae646f6e62670f8f6a
      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zkl-lean"
          curl --fail --location --retry 2 --max-time 180 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/zkl-lean/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/zkl-lean/lean.tar.zst" -C "$RUNNER_TEMP/zkl-lean"
          echo "$RUNNER_TEMP/zkl-lean/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check five explicit equalities
        run: |
          set -euo pipefail
          lean --version
          timeout 45s lean "$RUNNER_TEMP/TermExamples.lean" | tee lean-result.txt
          test "$(grep -c 'does not depend on any axioms' lean-result.txt)" = 5
