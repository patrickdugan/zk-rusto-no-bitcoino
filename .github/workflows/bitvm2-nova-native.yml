name: BitVM2 Nova native transcript and proof checks
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '.github/workflows/bitvm2-nova-native.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '.github/workflows/bitvm2-nova-native.yml']
permissions:
  contents: read
jobs:
  production-native-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    defaults:
      run:
        shell: bash
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned mature Keccak implementation
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install --disable-pip-version-check -r transcript-requirements.txt
      - name: Transcript, framing, sumcheck and proof admission reference regressions
        run: |
          set -euo pipefail
          {
            python -m unittest discover -s tests -p test_production_transcript.py -v
            python -m unittest discover -s tests -p test_nht4.py -v
            python -m unittest discover -s tests -p test_spartan_checks.py -v
            python -m unittest discover -s tests -p test_proof_codec.py -v
            python -m unittest discover -s tests -p test_admission_generation.py -v
            python -m unittest discover -s tests -p test_poseidon_reference.py -v
            python -m unittest discover -s tests -p test_poseidon_generation.py -v
            python -m unittest discover -s tests -p test_matrix_reference.py -v
            python -m unittest discover -s tests -p test_matrix_export.py -v
            python -m unittest discover -s tests -p test_ipa_export.py -v
            python -m unittest discover -s tests -p test_ipa_statement.py -v
            python -m unittest discover -s tests -p test_ipa_runtime.py -v
            python -m unittest discover -s tests -p test_ipa_msm_benchmark.py -v
            python -m unittest discover -s tests -p test_production_replay.py -v
            python -m unittest discover -s tests -p test_replay_cli.py -v
          } 2>&1 | tee results/native-python-tests.txt
      - name: Generate bounded transcript, sumcheck and retained-proof inputs
        run: |
          set -euo pipefail
          python bench_transcript.py --cases results/native-transcript-inputs.json | tee results/native-transcript-generation.json
          python bench_spartan.py results/native-spartan-inputs.json | tee results/native-spartan-generation.json
          python bench_nht4.py | tee results/native-nht4-generation.json
      - name: Resolve and authenticate the exact published Nova backend
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version | tee results/native-rust-version.txt
          cargo fmt --manifest-path nova-oracle/Cargo.toml -- --check
          cargo generate-lockfile --manifest-path nova-oracle/Cargo.toml
          python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          packages = tomllib.loads(Path('nova-oracle/Cargo.lock').read_text())['package']
          nova = [p for p in packages if p['name'] == 'nova-snark']
          expected = 'c9bb3809a6c70057ea722c1c4fe5097cf29a3479d0b4671f3cddb1d81043bb31'
          if len(nova) != 1 or nova[0]['version'] != '0.76.0':
              raise SystemExit('expected exactly the production Nova 0.76.0 release')
          if (nova[0].get('source') != 'registry+https://github.com/rust-lang/crates.io-index'
                  or nova[0].get('checksum') != expected):
              raise SystemExit('Nova release source/checksum mismatch')
          revision = 'de607d3db17d400dd6c2923d357f1d4a7bf233c7'
          headers = [p for p in packages if p['name'] == 'nova-header-chain']
          source = 'git+https://github.com/patrickdugan/zk-rusto-no-bitcoino?rev=' + revision + '#' + revision
          if len(headers) != 1 or headers[0].get('source') != source:
              raise SystemExit('header circuit source revision mismatch')
          Path('results/native-lock-pins.json').write_text(json.dumps({
              'nova_version': nova[0]['version'], 'nova_crate_sha256': expected,
              'header_revision': revision, 'verified': True}, indent=2) + '\n')
          PY
          cargo tree --locked --manifest-path nova-oracle/Cargo.toml > results/native-cargo-tree.txt
          cargo tree --locked -e features --manifest-path nova-oracle/Cargo.toml > results/native-cargo-features.txt
          cargo metadata --locked --format-version 1 --manifest-path nova-oracle/Cargo.toml > results/native-cargo-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('results/native-cargo-metadata.json').read_text())
          ids = {p['id'] for p in data['packages'] if p['name'] == 'nova-snark'}
          nodes = [n for n in data['resolve']['nodes'] if n['id'] in ids]
          if len(nodes) != 1 or {'evm', 'test-utils', 'blitzar'} & set(nodes[0]['features']):
              raise SystemExit('unsupported EVM/test-utils/GPU Nova feature activation')
          PY
      - name: Build native conformance binaries on the hosted runner
        timeout-minutes: 16
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/native-build-time.txt timeout --signal=KILL 900s \
            cargo build --release --locked --jobs 2 --manifest-path nova-oracle/Cargo.toml --bins
      - name: Compare actual upstream transcript and Spartan arithmetic
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s nova-oracle/target/release/transcript results/native-transcript-inputs.json \
            | tee results/native-transcript-execution.json
          timeout --signal=KILL 120s nova-oracle/target/release/sumcheck results/native-spartan-inputs.json \
            | tee results/native-spartan-execution.json
      - name: Test selective trusted-key dimension extraction without setup
        run: |
          set -euo pipefail
          timeout --signal=KILL 90s cargo test --release --locked --jobs 2 \
            --manifest-path nova-oracle/Cargo.toml --bin nht4 -- --test-threads=1 \
            2>&1 | tee results/native-dimension-unit-tests.txt
      - name: Test transparent tracing wrappers without circuit setup
        run: |
          set -euo pipefail
          timeout --signal=KILL 90s cargo test --release --locked --jobs 2 \
            --manifest-path nova-oracle/Cargo.toml --bin replay -- --test-threads=1 \
            2>&1 | tee results/native-replay-unit-tests.txt
      - name: Test Poseidon admission and state extraction without circuit setup
        run: |
          set -euo pipefail
          timeout --signal=KILL 90s cargo test --release --locked --jobs 2 \
            --manifest-path nova-oracle/Cargo.toml --bin poseidon -- --test-threads=1 \
            2>&1 | tee results/native-poseidon-unit-tests.txt
      - name: Compare independent Poseidon arithmetic against actual Nova APIs
        run: |
          set -euo pipefail
          python bench_poseidon.py --parameters fixtures/nht4-genesis-0-2020-k5.poseidon.json \
            --output results/native-poseidon-inputs.json | tee results/native-poseidon-generation.json
          /usr/bin/time -v -o results/native-poseidon-time.txt \
            timeout --signal=KILL 90s prlimit --as=268435456 --cpu=60 -- \
            nova-oracle/target/release/poseidon results/native-poseidon-inputs.json \
            fixtures/nht4-genesis-0-2020-k5.poseidon.json \
            | tee results/native-poseidon-execution.json
          cat results/native-poseidon-time.txt
      - name: Verify retained NHT4 proof with a strict 3 GiB and ten-minute cap
        timeout-minutes: 11
        run: |
          set -euo pipefail
          trap 'cat results/native-nht4-stderr.txt results/native-nht4-time.txt >&2 || true' ERR
          # This reconstructs deterministic transparent parameters/VK and verifies
          # an existing proof. It never calls a proving or recursive-step API.
          /usr/bin/time -v -o results/native-nht4-time.txt \
            timeout --signal=KILL 600s prlimit --as=3221225472 --cpu=600 -- \
            nova-oracle/target/release/nht4 results/nht4-inputs.json \
            > results/native-nht4-execution.json 2> results/native-nht4-stderr.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/native-nht4-execution.json').read_text())
          if report.get('passed') is not True or report.get('native', {}).get('native_nova_proofs_verified') != 1:
              raise SystemExit('native proof verification did not complete successfully')
          native = report['native']
          print(json.dumps({'passed': report['passed'],
              'framing_cases': len(report['framing_cases']),
              'framing_rejections': sum(not row['accepted'] for row in report['framing_cases']),
              'native_nova_proofs_verified': native['native_nova_proofs_verified'],
              'negative_checks': native['negative_checks'],
              'verifier_key_sha256': native['verifier_key_sha256'],
              'end_state_sha256': native['end_state_sha256'], 'end_height': native['end_height'],
              'key_reconstruction_seconds': native['key_reconstruction_seconds'],
              'verify_seconds': native['verify_seconds'],
              'verifier_dimensions': native['verifier_dimensions'],
              'dimension_export': native['dimension_export']}))
          import hashlib
          encoded = json.dumps(native['verifier_dimensions'], sort_keys=True,
                               separators=(',', ':'), ensure_ascii=True).encode('utf-8')
          if hashlib.sha256(encoded).hexdigest() != native['verifier_dimensions_sha256']:
              raise SystemExit('Rust/Python canonical descriptor SHA256 mismatch')
          print(json.dumps({'verifier_dimensions_canonical_sha256': hashlib.sha256(encoded).hexdigest()}))
          PY
          cat results/native-nht4-time.txt
      - name: Test the mature CPU IPA terminal checker on tiny curves
        run: |
          set -euo pipefail
          timeout --signal=KILL 90s cargo test --release --locked --jobs 2 \
            --manifest-path nova-oracle/Cargo.toml --bin ipa_msm -- --test-threads=1 \
            2>&1 | tee results/native-ipa-msm-unit-tests.txt
      - name: Capture actual retained-proof verification with forwarding engines
        timeout-minutes: 11
        run: |
          set -euo pipefail
          trap 'cat results/native-replay-stderr.txt results/native-replay-time.txt >&2 || true' ERR
          /usr/bin/time -v -o results/native-replay-time.txt \
            timeout --signal=KILL 600s prlimit --as=3221225472 --cpu=600 -- \
            nova-oracle/target/release/replay fixtures/nht4-genesis-0-2020-k5.nht4 \
            fixtures/nht4-genesis-0-2020-k5.expected.json \
            fixtures/nht4-genesis-0-2020-k5.dimensions.json \
            --matrix-output results/native-matrices \
            --ipa-output results/native-ipa-generators \
            > results/native-replay-execution.json 2> results/native-replay-stderr.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          report = json.loads(Path('results/native-replay-execution.json').read_text())
          if report.get('passed') is not True or report.get('native_nova_proofs_verified') != 1:
              raise SystemExit('tracing engine did not verify the retained proof')
          def digest(value):
              raw = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
              return hashlib.sha256(raw).hexdigest()
          if digest(report['key_bindings']) != report['key_bindings_sha256']:
              raise SystemExit('trusted key-binding canonical digest mismatch')
          parameters = report['poseidon_parameters']
          if digest(parameters) != report['poseidon_parameters_sha256']:
              raise SystemExit('authenticated Poseidon parameter digest mismatch')
          matrix_profile = report['matrix_profile']
          if digest(matrix_profile) != report['matrix_profile_sha256']:
              raise SystemExit('matrix metadata canonical digest mismatch')
          matrix_stats = report['matrix_profile_export']
          expected_stats = {'numeric_fields_read': 12, 'sequence_lengths_read': 18,
              'matrices_profiled': 6, 'matrix_elements_read': 0,
              'matrix_payloads_materialized': False, 'full_key_materialized': False}
          if any(type(matrix_stats.get(k)) is not type(v) or matrix_stats[k] != v
                 for k, v in expected_stats.items()):
              raise SystemExit('matrix metadata export traversed payload or missed a selected header')
          for role, engine in (('primary', 'pallas'), ('secondary', 'vesta')):
              shape = matrix_profile[role]
              if shape['engine'] != engine or shape['field_role'] != engine+'_scalar':
                  raise SystemExit('matrix scalar-field role mismatch')
              if any(shape[k] != report['verifier_dimensions'][role][k]
                     for k in ('num_cons', 'num_vars', 'num_io')):
                  raise SystemExit('matrix metadata dimensions differ from independent profile')
          collection = report['matrix_collection']
          if (type(collection) is not dict or len(collection.get('files', [])) != 6
                  or digest(collection) != report['matrix_collection_sha256']
                  or collection.get('matrix_profile_sha256') != report['matrix_profile_sha256']
                  or collection.get('total_bytes') != 119674848):
              raise SystemExit('optional matrix payload export is incomplete or has inconsistent metadata')
          payload_stats = report['matrix_payload_export']
          expected_payload_stats = {'files_written': 6, 'selected_matrix_fields': 6,
              'total_bytes': 119674848, 'per_file_cap_bytes': 67108864,
              'total_cap_bytes': 167772160, 'writer_buffer_bytes': 65536,
              'full_key_materialized': False, 'matrix_payloads_materialized': False}
          if any(type(payload_stats.get(k)) is not type(v) or payload_stats[k] != v
                 for k, v in expected_payload_stats.items()):
              raise SystemExit('matrix payload export budget or materialization mismatch')
          ipa_generators = report['ipa_generators']
          if (type(ipa_generators) is not dict or len(ipa_generators.get('files', [])) != 2
                  or digest(ipa_generators) != report['ipa_generators_sha256']
                  or ipa_generators.get('total_bytes') != 17301520):
              raise SystemExit('IPA generator projection is incomplete or inconsistent')
          ipa_stats = report['ipa_generator_export']
          expected_ipa_stats = {'files_written': 2, 'selected_generator_fields': 2,
              'total_bytes': 17301520, 'per_file_cap_bytes': 33554432,
              'total_cap_bytes': 33554432, 'writer_buffer_bytes': 65536,
              'full_key_materialized': False, 'generator_vectors_materialized': False}
          if any(type(ipa_stats.get(k)) is not type(v) or ipa_stats[k] != v
                 for k, v in expected_ipa_stats.items()):
              raise SystemExit('IPA generator export budget or materialization mismatch')
          profiles = [{key: profile[key] for key in ('arity', 'width', 'rate', 'capacity', 'rf', 'rp', 's', 'ht')}
                      | {'engine': parameters[role]['engine'], 'mode': mode,
                         'compressed_constants': len(profile['crc']), 'sparse_matrices': len(profile['sm'])}
                      for role in ('primary', 'secondary') for mode in ('wide', 'narrow')
                      for profile in (parameters[role][mode],)]
          trace = report['trace']
          keccak = [stream for stream in trace['streams'] if stream['kind'] == 'keccak']
          poseidon = [stream for stream in trace['streams'] if stream['kind'].startswith('poseidon_')]
          if (len(keccak) != 2 or len(poseidon) != 5
                  or sorted(len(stream['events']) for stream in keccak) != [154, 204]
                  or sorted(len(stream['events']) for stream in poseidon) != [11, 22, 36, 36, 54]
                  or trace['events'] != 517 or trace['complete_capture'] is not True):
              raise SystemExit('retained proof transcript coverage mismatch')
          summary = [{key: stream[key] for key in ('kind', 'engine', 'field_role', 'session')}
                     | {'events': len(stream['events'])} for stream in trace['streams']]
          print(json.dumps({'passed': True, 'native_nova_proofs_verified': 1,
              'key_bindings': report['key_bindings'],
              'key_bindings_sha256': report['key_bindings_sha256'],
              'trace_sha256': digest(trace), 'streams': summary,
              'events': trace['events'], 'recorded_event_bytes': trace['recorded_event_bytes'],
              'complete_capture': trace['complete_capture'],
              'poseidon_parameters_sha256': report['poseidon_parameters_sha256'],
              'poseidon_parameter_export': report['poseidon_parameter_export'],
              'matrix_profile': matrix_profile, 'matrix_profile_sha256': report['matrix_profile_sha256'],
              'matrix_profile_export': matrix_stats,
              'matrix_collection': collection, 'matrix_collection_sha256': report['matrix_collection_sha256'],
              'matrix_payload_export': payload_stats,
              'matrix_payload_export_seconds': report['matrix_payload_export_seconds'],
              'ipa_generators': ipa_generators, 'ipa_generators_sha256': report['ipa_generators_sha256'],
              'ipa_generator_export': ipa_stats,
              'ipa_generator_export_seconds': report['ipa_generator_export_seconds'],
              'poseidon_profiles': profiles}))
          PY
          cat results/native-replay-time.txt
      - name: Independently hash the optional authenticated matrix export
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s prlimit --as=268435456 --cpu=90 -- \
            python bench_matrix_export.py --native-report results/native-replay-execution.json \
            --matrix-dir results/native-matrices \
            --output results/native-matrix-export-conformance.json \
            | tee results/native-matrix-export-summary.json
          cp -- results/native-matrices/collection.json results/native-matrix-collection.json
      - name: Independently replay proof-bound production transcript events
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/native-production-python-replay-time.txt \
            timeout --signal=KILL 360s prlimit --as=536870912 --cpu=300 -- \
            python bench_replay.py --native-report results/native-replay-execution.json \
            --matrix-dir results/native-matrices \
            --output results/native-production-python-replay.json \
            | tee results/native-production-python-replay-summary.json
          cat results/native-production-python-replay-time.txt
          python - <<'PY'
          import json
          from pathlib import Path
          replay = json.loads(Path('results/native-production-python-replay.json').read_bytes())['replay']
          if (replay.get('matrix_evaluations_verified') is not True
                  or replay.get('matrix_files_checked') != 6
                  or replay.get('matrix_inner_terminals_checked') != 2
                  or replay.get('matrix_entries_checked') != 2667462
                  or replay.get('matrix_bytes_checked') != 119674848
                  or replay.get('matrix_collection_sha256') != 'fb7dc2a6a27d366a742a97928dffa2209dfdb961f27190164e51494e7a6746e0'):
              raise SystemExit('independent actual matrix replay coverage mismatch')
          if any(replay.get(flag) is not False for flag in
                 ('ipa_generator_msm_verified', 'proof_verified', 'bitvm2_script_verified')):
              raise SystemExit('matrix replay overclaimed an unimplemented verification stage')
          PY
      - name: Independently hash the optional authenticated IPA generator export
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s prlimit --as=268435456 --cpu=90 -- \
            python bench_ipa_export.py --native-report results/native-replay-execution.json \
            --generator-dir results/native-ipa-generators --output results/native-ipa-export.json \
            | tee results/native-ipa-export-summary.json
          cp -- results/native-ipa-generators/collection.json results/native-ipa-generator-collection.json
      - name: Directly execute both proof-derived IPA terminal relations on CPU
        timeout-minutes: 14
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/native-ipa-msm-time.txt \
            timeout --signal=KILL 800s prlimit --as=536870912 --cpu=780 -- \
            python bench_ipa_msm.py --native-report results/native-replay-execution.json \
            --generator-dir results/native-ipa-generators --native-msm nova-oracle/target/release/ipa_msm \
            --output results/native-ipa-msm-execution.json | tee results/native-ipa-msm-summary.json
          cat results/native-ipa-msm-time.txt
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results/native-ipa-msm-execution.json').read_bytes())
          if (result.get('ipa_native_msm_executed') is not True
                  or result.get('ipa_native_relation_checked') is not True
                  or result.get('native_msm_executions') != 2
                  or result.get('generator_count') != 540672
                  or result.get('generator_payload_bytes') != 17301520):
              raise SystemExit('both actual IPA terminal executions must complete')
          if any(result.get(flag) is not False for flag in
                 ('ipa_python_msm_independently_computed', 'ipa_generator_msm_verified',
                  'ipa_complete_verification', 'proof_verified', 'bitvm2_script_verified')):
              raise SystemExit('native IPA terminal conformance overclaimed proof/Script verification')
          PY
      - name: Compare genuine proof coefficients in explicit synthetic transcript states
        run: |
          set -euo pipefail
          # This optional corpus feature is exercised only after real proof
          # verification succeeds; it is not that proof's full transcript replay.
          python bench_spartan.py results/native-spartan-expanded-inputs.json \
            --native-report results/native-nht4-execution.json \
            | tee results/native-spartan-expanded-generation.json
          timeout --signal=KILL 120s nova-oracle/target/release/sumcheck results/native-spartan-expanded-inputs.json \
            | tee results/native-spartan-expanded-execution.json
      - name: Generate bounded adversarial proof admission corpus from the pinned key profile
        run: |
          set -euo pipefail
          python bench_admission.py --native-report results/native-nht4-execution.json \
            --descriptor fixtures/nht4-genesis-0-2020-k5.dimensions.json \
            --output results/native-admission-inputs.json \
            | tee results/native-admission-generation.json
      - name: Independently admit malformed proof shapes under a 256 MiB process cap
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/native-admission-time.txt \
            timeout --signal=KILL 90s prlimit --as=268435456 --cpu=60 -- \
            nova-oracle/target/release/admission results/native-admission-inputs.json \
            results/native-nht4-execution.json fixtures/nht4-genesis-0-2020-k5.expected.json \
            fixtures/nht4-genesis-0-2020-k5.dimensions.json \
            | tee results/native-admission-execution.json
          cat results/native-admission-time.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-production-native-evidence
          path: |
            integrations/bitvm2-nova/nova-oracle/Cargo.lock
            integrations/bitvm2-nova/results/native-*
            integrations/bitvm2-nova/results/nht4-inputs.json
            integrations/bitvm2-nova/results/nht4-summary.json
            !integrations/bitvm2-nova/results/native-matrices/**
            !integrations/bitvm2-nova/results/native-ipa-generators/**
