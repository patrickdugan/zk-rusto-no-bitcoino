name: Transparent SNARK research policy

on:
  push:
    paths:
      - 'research/transparent-snarks/**'
      - '.github/workflows/transparent-snarks.yml'
  pull_request:
    paths:
      - 'research/transparent-snarks/**'
      - '.github/workflows/transparent-snarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate declared pipeline
        run: python research/transparent-snarks/policy.py check research/transparent-snarks/plan.json
      - name: Generate benchmark plan
        run: python research/transparent-snarks/policy.py matrix research/transparent-snarks/plan.json
      - name: Test policy and parser
        run: python -m unittest discover -s research/transparent-snarks -p 'test_*.py' -v
