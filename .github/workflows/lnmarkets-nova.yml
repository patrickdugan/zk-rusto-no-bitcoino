name: LNMarkets Nova/BitVM3 folding

on:
  push:
    branches: ['prototype/lnmarkets-batch-prover-20261120']
    paths:
      - 'LNMarkets/nova/**'
      - 'LNMarkets/statement/**'
      - '.github/workflows/lnmarkets-nova.yml'
  pull_request:
    paths:
      - 'LNMarkets/nova/**'
      - 'LNMarkets/statement/**'
      - '.github/workflows/lnmarkets-nova.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lnmarkets-nova-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nova:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Nova crate formatting
        run: cargo fmt --manifest-path LNMarkets/nova/Cargo.toml -- --check
      - name: Native signature/statement and Nova R1CS tests
        run: cargo test --manifest-path LNMarkets/nova/Cargo.toml --lib
      - name: Nova circuit lint
        run: cargo clippy --manifest-path LNMarkets/nova/Cargo.toml --all-targets -- -D warnings
      - name: Check 1 and 2 contract transcript encodings
        run: |
          cargo run --release --manifest-path LNMarkets/nova/Cargo.toml --bin lnm-nova -- trace 1
          cargo run --release --manifest-path LNMarkets/nova/Cargo.toml --bin lnm-nova -- trace 2
      - name: Real Nova IVC smoke proof
        run: cargo run --release --manifest-path LNMarkets/nova/Cargo.toml --bin lnm-nova -- prove 1
      - name: Nova recursive proof scaling
        timeout-minutes: 20
        run: |
          mkdir -p LNMarkets/.local/nova
          for rows in 1 2 8 32; do
            cargo run --release --manifest-path LNMarkets/nova/Cargo.toml --bin lnm-nova -- prove "$rows" > "LNMarkets/.local/nova/recursive-$rows.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["nova_recursive_verified"]; print(r["rows"], r["nova_prove_seconds"], r["nova_verify_seconds"])' "LNMarkets/.local/nova/recursive-$rows.json"
          done
      - name: Two-contract Spartan-IPA compressed Nova proof
        timeout-minutes: 35
        run: |
          cargo run --release --manifest-path LNMarkets/nova/Cargo.toml --bin lnm-nova -- prove 2 --compressed > LNMarkets/.local/nova/compressed-2.json
          python3 -c 'import json; r=json.load(open("LNMarkets/.local/nova/compressed-2.json")); assert r["nova_recursive_verified"] and r["nova_compressed_verified"] and r["compressed_bytes"] > 0; print(r["compressed_bytes"],r["compressed_prove_seconds"],r["compressed_verify_seconds"])'
      - name: Upload synthetic Nova measurement receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lnmarkets-nova-measurements
          path: LNMarkets/.local/nova/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
