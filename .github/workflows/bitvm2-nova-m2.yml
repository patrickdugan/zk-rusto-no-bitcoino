name: BitVM2 Nova M2 trace checks
on:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '.github/workflows/bitvm2-nova-m2.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '.github/workflows/bitvm2-nova-m2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-and-curve-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
    defaults:
      run:
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing and new Python tests
        run: |
          set -o pipefail
          python -m pip install -r transcript-requirements.txt
          python -m unittest discover -s tests -v 2>&1 | tee results/m2-ci-tests.txt
      - name: Generate streaming fixtures and size ledger
        run: python bench_m2.py | tee results/m2-ci-generation.txt
      - name: Generate compact comparison and adversarial fixtures
        run: |
          set -o pipefail
          python bench_compact.py | tee results/compact-ci-generation.txt
      - name: Build pinned independent oracles
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version | tee results/m2-rust-version.txt
          cargo generate-lockfile --manifest-path m2-oracle/Cargo.toml
          cargo tree --locked --manifest-path m2-oracle/Cargo.toml > results/m2-dependency-tree.txt
          cargo build --locked --manifest-path m2-oracle/Cargo.toml
      - name: Compare curve arithmetic with halo2curves
        run: |
          set -o pipefail
          m2-oracle/target/debug/bitvm2-nova-m2-oracle --curves results/m2-curve-vectors.json | tee results/m2-halo2curves.json
      - name: Execute Script with initial witnesses and OP_CAT disabled
        run: |
          set -o pipefail
          /usr/bin/time -v -o results/m2-rust-time.txt m2-oracle/target/debug/bitvm2-nova-m2-oracle --scripts results/m2-engine-vectors.jsonl | tee results/m2-scriptexec.json
      - name: Independently execute compact graphs and adversarial vectors
        run: |
          set -o pipefail
          /usr/bin/time -v -o results/compact-ci-rust-time.txt m2-oracle/target/debug/bitvm2-nova-m2-oracle --scripts results/compact-engine-vectors.jsonl | tee results/compact-scriptexec.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-m2-evidence
          path: |
            integrations/bitvm2-nova/results/m2-*
            integrations/bitvm2-nova/results/compact-*
            integrations/bitvm2-nova/m2-oracle/Cargo.lock
