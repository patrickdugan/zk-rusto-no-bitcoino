name: BitVM2 Nova framed byte rho hash reduction checks
on:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-byte-rho.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-byte-rho.yml']
permissions:
  contents: read
jobs:
  framed-byte-rho-and-global-forest-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      CUDA_VISIBLE_DEVICES: ''
    defaults:
      run:
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check both framed branches, shared messages and unchanged reducer guards
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install -r transcript-requirements.txt
          /usr/bin/time -v -o results/byte-rho-python-time.txt \
            timeout --signal=KILL 480s prlimit --as=268435456 --cpu=480 -- \
            python -m unittest discover -s tests -p 'test_byte_rho*.py' -v \
            2>&1 | tee results/byte-rho-python-tests.txt
      - name: Build pinned rho worker and independently test tail and forest rules
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustc --version | tee results/byte-rho-rust-version.txt
          rustfmt --edition 2021 --check rust-oracle/src/registry.rs rust-oracle/src/taproot_commitment.rs rust-oracle/src/taproot_forest.rs rust-oracle/src/byte_rho_tail.rs rust-oracle/src/byte_rho_source.rs rust-oracle/src/byte_rho_keys.rs rust-oracle/src/bin/byte_rho.rs
          cargo generate-lockfile --manifest-path rust-oracle/Cargo.toml
          cargo tree --locked --manifest-path rust-oracle/Cargo.toml > results/byte-rho-dependencies.txt
          cargo test --release --locked --manifest-path rust-oracle/Cargo.toml --lib registry::tests -- --nocapture
          cargo test --release --locked --manifest-path rust-oracle/Cargo.toml --lib taproot_forest::tests -- --nocapture
          cargo test --release --locked --manifest-path rust-oracle/Cargo.toml --bin byte_rho -- --nocapture
          cargo build --release --locked --manifest-path rust-oracle/Cargo.toml --bin byte_rho
      - name: Execute bounded full and targeted cases with actual framing and digest openings
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/byte-rho-execution-time.txt \
            timeout --signal=KILL 1500s prlimit --as=536870912 --cpu=1500 -- \
            python bench_byte_rho.py --cases-dir results/byte-rho-cases \
            --native-worker rust-oracle/target/release/byte_rho \
            --output results/byte-rho-conformance.json | tee results/byte-rho-stdout.json
          cat results/byte-rho-execution-time.txt
          cp results/byte-rho-cases/manifest.json results/byte-rho-manifest.json
          sha256sum results/byte-rho-manifest.json results/byte-rho-conformance.json > results/byte-rho-report-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-byte-rho-evidence
          path: |
            integrations/bitvm2-nova/results/byte-rho-*.json
            integrations/bitvm2-nova/results/byte-rho-*.txt
            integrations/bitvm2-nova/rust-oracle/Cargo.lock
