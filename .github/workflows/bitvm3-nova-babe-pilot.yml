name: Nova BABE transparent soldering pilot
on:
  push:
    branches: ['main', 'exp/**']
    paths: ['integrations/bitvm3-nova/babe-pilot/**', 'integrations/bitvm3-nova/m12/**', 'integrations/bitvm3-nova/m13/**', 'integrations/bitvm3-nova/m14/**', '.github/workflows/bitvm3-nova-babe-pilot.yml']
  pull_request:
    paths: ['integrations/bitvm3-nova/babe-pilot/**', 'integrations/bitvm3-nova/m12/**', 'integrations/bitvm3-nova/m13/**', 'integrations/bitvm3-nova/m14/**', '.github/workflows/bitvm3-nova-babe-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-babe-pilot-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  babe-pilot:
    name: Complete trace, durable recovery and funded Core disputes (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
      RAYON_NUM_THREADS: '4'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
      - name: Check Bitcoin Core provenance rejection paths
        run: python3 integrations/bitvm3-nova/babe-pilot/scripts/test_core_provenance.py
      - name: Install Bitcoin Core build dependencies
        id: core-deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          packages = subprocess.run(['dpkg-query', '-W', '-f=${binary:Package}=${Version}\n'], capture_output=True, text=True, check=True).stdout
          versions, executables = {}, {}
          for name in ('cc', 'c++', 'ld', 'cmake'):
              executable = pathlib.Path(shutil.which(name)).resolve()
              versions[name] = subprocess.run([str(executable), '--version'], capture_output=True, text=True, check=True).stdout
              executables[name] = hashlib.sha256(executable.read_bytes()).hexdigest()
          toolchain = {'packages':sorted(packages.splitlines()), 'versions':versions, 'executables_sha256':executables,
                       'compiler_environment':{name:os.environ.get(name) for name in ('CC', 'CXX', 'CFLAGS', 'CXXFLAGS', 'LDFLAGS')}}
          encoded = json.dumps(toolchain, sort_keys=True).encode()
          output = pathlib.Path('integrations/bitvm3-nova/babe-pilot/ci')
          output.mkdir(parents=True, exist_ok=True)
          (output/'core-toolchain.json').write_bytes(encoded+b'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('fingerprint='+hashlib.sha256(encoded).hexdigest()+'\n')
          PY
      - name: Restore pinned Bitcoin Core source build
        id: core-source-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/babe-core-source
          key: bitcoin-core-source-v1-ubuntu24-${{ runner.arch }}-9be056a8a72b624dae9623b2f7bded92c2a21c91-${{ steps.core-deps.outputs.fingerprint }}-${{ hashFiles('.github/workflows/bitvm3-nova-babe-pilot.yml', 'integrations/bitvm3-nova/babe-pilot/scripts/run-regtest.py') }}
      - name: Build pinned Bitcoin Core before proving
        timeout-minutes: 18
        run: |
          set -o pipefail
          BABE_CORE_SOURCE="$RUNNER_TEMP/babe-core-source"
          BABE_CORE_COMMIT=9be056a8a72b624dae9623b2f7bded92c2a21c91
          mkdir -p integrations/bitvm3-nova/babe-pilot/ci
          if [ ! -d "$BABE_CORE_SOURCE/.git" ]; then
            git init "$BABE_CORE_SOURCE"
            git -C "$BABE_CORE_SOURCE" remote add origin https://github.com/bitcoin/bitcoin.git
            git -C "$BABE_CORE_SOURCE" fetch --depth=1 origin "$BABE_CORE_COMMIT"
            git -C "$BABE_CORE_SOURCE" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$BABE_CORE_SOURCE" rev-parse HEAD)" = "$BABE_CORE_COMMIT"
          test "$(git -C "$BABE_CORE_SOURCE" remote get-url origin)" = https://github.com/bitcoin/bitcoin.git
          test -z "$(git -C "$BABE_CORE_SOURCE" status --porcelain=v1 --untracked-files=all)"
          python3 - "$BABE_CORE_SOURCE" <<'PY'
          import importlib.util, json, pathlib, subprocess, sys, types
          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path('integrations/bitvm3-nova/babe-pilot/ci')
          configure = ['cmake', '-S', str(source), '-B', str(source/'build'),
                       '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG',
                       '-DBUILD_DAEMON=ON', '-DBUILD_CLI=ON', '-DENABLE_WALLET=ON',
                       '-DBUILD_TESTS=OFF', '-DBUILD_GUI=OFF', '-DBUILD_BENCH=OFF',
                       '-DBUILD_FUZZ_BINARY=OFF', '-DBUILD_BITCOIN_BIN=OFF', '-DBUILD_TX=OFF',
                       '-DBUILD_UTIL=OFF', '-DBUILD_WALLET_TOOL=OFF', '-DENABLE_IPC=OFF', '-DWITH_CCACHE=OFF']
          build = ['cmake', '--build', str(source/'build'), '--target', 'bitcoind', 'bitcoin-cli', '--parallel', '4']
          for command, name in ((configure, 'core-configure.txt'), (build, 'core-build.txt')):
              with (output/name).open('w') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  if process.wait():
                      raise SystemExit(process.returncode)
          cache = (source/'build/CMakeCache.txt').read_text().splitlines()
          compiler = next(line.split('=', 1)[1] for line in cache if line.startswith('CMAKE_CXX_COMPILER:FILEPATH='))
          metadata = {'schema':'babe-core-source-build/v1', 'configure_argv':configure, 'build_argv':build,
                      'compiler_version':subprocess.run([compiler, '--version'], capture_output=True, text=True, check=True).stdout}
          (source/'build/build-info.json').write_text(json.dumps(metadata, indent=2)+'\n')
          script = pathlib.Path('integrations/bitvm3-nova/babe-pilot/scripts/run-regtest.py')
          spec = importlib.util.spec_from_file_location('regtest', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          receipt = module.verify_core(types.SimpleNamespace(bitcoin_bin=source/'build/bin', core_source=source, core_archive=None))
          (output/'core-provenance.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Cache verified Bitcoin Core source build
        if: steps.core-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/babe-core-source
          key: bitcoin-core-source-v1-ubuntu24-${{ runner.arch }}-9be056a8a72b624dae9623b2f7bded92c2a21c91-${{ steps.core-deps.outputs.fingerprint }}-${{ hashFiles('.github/workflows/bitvm3-nova-babe-pilot.yml', 'integrations/bitvm3-nova/babe-pilot/scripts/run-regtest.py') }}
      - name: Toolchain
        run: |
          mkdir -p integrations/bitvm3-nova/babe-pilot/ci
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustc +1.90.0 --version | tee integrations/bitvm3-nova/babe-pilot/ci/rustc.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            integrations/bitvm3-nova/babe-pilot/target
          key: babe-pilot-v2-${{ runner.os }}-rust190-${{ hashFiles('integrations/bitvm3-nova/babe-pilot/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            babe-pilot-v2-${{ runner.os }}-rust190-${{ hashFiles('integrations/bitvm3-nova/babe-pilot/Cargo.lock') }}-
            babe-m14-trace-v1-${{ runner.os }}-rust190-${{ hashFiles('integrations/bitvm3-nova/babe-pilot/Cargo.lock') }}-
      - name: Format and clippy checks
        run: |
          cargo +1.90.0 fmt --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml --all-targets -- -D warnings
      - name: Soundness, commitment binding, malformed input and end-to-end regressions
        run: |
          set -o pipefail
          cargo +1.90.0 test --release --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | tee integrations/bitvm3-nova/babe-pilot/ci/tests.txt
      - name: Measure authenticated relations and serialized Bitcoin samples
        run: |
          set -o pipefail
          cargo +1.90.0 run --release --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml --bin babe-pilot-bench -- integrations/bitvm3-nova/babe-pilot/ci/bench-results.json 2>&1 | tee integrations/bitvm3-nova/babe-pilot/ci/bench.txt
      - name: Build funded graph and durable session adapters
        run: cargo +1.90.0 build --release --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml --bin babe-regtest-graph --bin babe-session-fixtures
      - name: Prepare real Nova sessions without releasing inputs
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'babe-funded'
          work.mkdir()
          binary = pathlib.Path('integrations/bitvm3-nova/babe-pilot/target/release/babe-session-fixtures').resolve()
          output = pathlib.Path('integrations/bitvm3-nova/babe-pilot/ci')
          for scenario in ('honest', 'refute'):
              request = {'state_path': str(work/scenario), 'public_fixture_path': str(work/(scenario+'.json')), 'scenario': scenario}
              result = subprocess.run([str(binary), 'init'], input=json.dumps(request), text=True, capture_output=True, check=True)
              receipt = json.loads(result.stdout)
              assert receipt['input_released'] is False
              (output/(scenario+'-init.json')).write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Execute funded Bitcoin Core regtest
        run: |
          set -o pipefail
          BABE_CORE_SOURCE="$RUNNER_TEMP/babe-core-source"
          python3 integrations/bitvm3-nova/babe-pilot/scripts/run-regtest.py \
            --bitcoin-bin "$BABE_CORE_SOURCE/build/bin" --core-source "$BABE_CORE_SOURCE" \
            --graph-bin "$GITHUB_WORKSPACE/integrations/bitvm3-nova/babe-pilot/target/release/babe-regtest-graph" \
            --release-bin "$GITHUB_WORKSPACE/integrations/bitvm3-nova/babe-pilot/target/release/babe-session-fixtures" \
            --honest-fixture "$RUNNER_TEMP/babe-funded/honest.json" --bad-fixture "$RUNNER_TEMP/babe-funded/refute.json" \
            --honest-state "$RUNNER_TEMP/babe-funded/honest" --bad-state "$RUNNER_TEMP/babe-funded/refute" \
            --out integrations/bitvm3-nova/babe-pilot/ci/funded-regtest 2>&1 | tee integrations/bitvm3-nova/babe-pilot/ci/funded-regtest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-babe-pilot-${{ github.sha }}
          path: integrations/bitvm3-nova/babe-pilot/ci/
  m14-trace:
    name: Complete M14 entry point and explicit resource limits (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            integrations/bitvm3-nova/babe-pilot/target
          key: babe-m14-trace-v1-${{ runner.os }}-rust190-${{ hashFiles('integrations/bitvm3-nova/babe-pilot/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            babe-m14-trace-v1-${{ runner.os }}-rust190-${{ hashFiles('integrations/bitvm3-nova/babe-pilot/Cargo.lock') }}-
      - name: Compile optional adapter and check its proof and statement pins
        run: |
          set -o pipefail
          mkdir -p integrations/bitvm3-nova/babe-pilot/ci-m14
          cargo +1.90.0 clippy --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml --features m14-trace --all-targets -- -D warnings
          cargo +1.90.0 test --release --locked --manifest-path integrations/bitvm3-nova/babe-pilot/Cargo.toml --features m14-trace --test trace_m14_adapter -- --test-threads=1 --nocapture 2>&1 | tee integrations/bitvm3-nova/babe-pilot/ci-m14/adapter-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-babe-m14-adapter-${{ github.sha }}
          path: integrations/bitvm3-nova/babe-pilot/ci-m14/
