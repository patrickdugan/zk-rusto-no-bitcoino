name: BitVM2 Nova retained payload scalar origin checks
on:
  push:
    branches: ['main']
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-proof-payload-origins.yml']
  pull_request:
    paths: ['integrations/bitvm2-nova/**', '!integrations/bitvm2-nova/nova-oracle/**', '.github/workflows/bitvm2-nova-proof-payload-origins.yml']
permissions:
  contents: read
jobs:
  retained-payload-scalar-origins:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
      CUDA_VISIBLE_DEVICES: ''
      BITVM2_NOVA_PROOF_PAYLOAD_ORIGINS_TESTS: '1'
    defaults:
      run:
        working-directory: integrations/bitvm2-nova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check retained profile, scalar widths and unchanged compiler pins
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install -r transcript-requirements.txt
          timeout --signal=KILL 60s prlimit --as=268435456 --cpu=60 -- \
            python point_body_pins.py --check | tee results/proof-payload-origins-body-pins.json
          /usr/bin/time -v -o results/proof-payload-origins-python-time.txt \
            timeout --signal=KILL 480s prlimit --as=268435456 --cpu=480 -- \
            python -m unittest discover -s tests -p 'test_proof_payload_origins*.py' -v \
            2>&1 | tee results/proof-payload-origins-python-tests.txt
      - name: Build isolated legacy-only worker and check independent admission
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustc --version | tee results/proof-payload-origins-rust-version.txt
          rustfmt --edition 2021 --config skip_children=true --check proof-payload-origins-oracle/src/*.rs
          cargo generate-lockfile --manifest-path proof-payload-origins-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path auth-cost-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path rust-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path point-oracle/Cargo.toml
          cargo generate-lockfile --manifest-path scalar-source-oracle/Cargo.toml
          cargo tree --locked --manifest-path proof-payload-origins-oracle/Cargo.toml > results/proof-payload-origins-dependencies.txt
          cargo test --release --locked --manifest-path proof-payload-origins-oracle/Cargo.toml -- --nocapture
          cargo build --release --locked --manifest-path proof-payload-origins-oracle/Cargo.toml --bin proof_payload_origins
      - name: Execute complete honest source and explicitly targeted claims
        run: |
          set -euo pipefail
          /usr/bin/time -v -o results/proof-payload-origins-execution-time.txt \
            timeout --signal=KILL 1500s prlimit --as=536870912 --cpu=1500 -- \
            python bench_proof_payload_origins.py --cases-dir results/proof-payload-origins-cases \
            --native-worker proof-payload-origins-oracle/target/release/proof_payload_origins \
            --output results/proof-payload-origins-conformance.json | tee results/proof-payload-origins-stdout.json
          cat results/proof-payload-origins-execution-time.txt
          cp results/proof-payload-origins-cases/manifest.json results/proof-payload-origins-manifest.json
          sha256sum results/proof-payload-origins-manifest.json results/proof-payload-origins-conformance.json \
            > results/proof-payload-origins-report-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitvm2-nova-proof-payload-origins-evidence
          path: |
            integrations/bitvm2-nova/results/proof-payload-origins-*.json
            integrations/bitvm2-nova/results/proof-payload-origins-*.txt
            integrations/bitvm2-nova/proof-payload-origins-oracle/Cargo.lock
            integrations/bitvm2-nova/auth-cost-oracle/Cargo.lock
            integrations/bitvm2-nova/rust-oracle/Cargo.lock
            integrations/bitvm2-nova/point-oracle/Cargo.lock
            integrations/bitvm2-nova/scalar-source-oracle/Cargo.lock
