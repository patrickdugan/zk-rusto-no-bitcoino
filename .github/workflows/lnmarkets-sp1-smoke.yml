name: LN Markets SP1 one-row execution

on:
  push:
    branches: ['prototype/lnmarkets-batch-prover-20261120']
    paths:
      - 'LNMarkets/**'
      - '.github/workflows/lnmarkets-sp1-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lnm-sp1-one-row
  cancel-in-progress: true

jobs:
  guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      SP1_CIRCUIT_MODE: release
      SP1_PROVER: cpu
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Protocol Buffers compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version
      - name: Pinned SP1 v6.9.0 toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sp1up.succinct.xyz | bash
          export PATH="$HOME/.sp1/bin:$PATH"
          sp1up --version v6.9.0
          cargo prove --version | grep -F 'b8387fa'
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          rustc +succinct -V
      - name: Build and independently check native fixture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cargo build --locked --release --manifest-path LNMarkets/statement/Cargo.toml --bin lnm-native
          LNMarkets/statement/target/release/lnm-native demo --rows 1 --out LNMarkets/.local/native-1
          LNMarkets/statement/target/release/lnm-native verify --witness LNMarkets/.local/native-1/witness.bin --journal LNMarkets/.local/native-1/journal.bin
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('LNMarkets')
          baseline=json.loads((root/'results/native-baseline.json').read_text())['runs'][0]
          journal=(root/'.local/native-1/journal.bin').read_bytes()
          assert len(journal)==276
          assert hashlib.sha256(journal).hexdigest()==baseline['journal_sha256']
          print('Journal matches committed native fixture digest')
          PY
      - name: Build RISC-V ELF and SDK host
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 LNMarkets/scripts/local_prover.py build --run
          test -f LNMarkets/.local/prover/elf/lnm-batch.elf
      - name: Pin candidate ELF and execute guest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 LNMarkets/scripts/local_prover.py describe --run --elf LNMarkets/.local/prover/elf/lnm-batch.elf
          ELF_SHA="$(jq -r '.elf_sha256' LNMarkets/.local/prover/program-candidate.json)"
          PROGRAM_VK="$(jq -r '.program_vk_digest' LNMarkets/.local/prover/program-candidate.json)"
          JOURNAL_SHA="$(jq -r '.runs[0].journal_sha256' LNMarkets/results/native-baseline.json)"
          [[ "$ELF_SHA" =~ ^[0-9a-f]{64}$ && "$PROGRAM_VK" =~ ^[0-9a-f]{64}$ && "$JOURNAL_SHA" =~ ^[0-9a-f]{64}$ ]]
          python3 LNMarkets/scripts/local_prover.py execute --run --elf LNMarkets/.local/prover/elf/lnm-batch.elf --witness LNMarkets/.local/native-1/witness.bin --journal LNMarkets/.local/native-1/journal.bin --elf-sha256 "$ELF_SHA" --program-vk "$PROGRAM_VK" --journal-sha256 "$JOURNAL_SHA"
          python3 - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('LNMarkets/.local/prover/execution.json').read_text())
          assert r['status']=='executed_unproved'
          assert r['journal_bytes']==276
          print('RISC-V guest completed, cycles:', r.get('instruction_count'))
          PY
      - name: Upload public execution reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lnmarkets-sp1-execution-reports
          path: |
            LNMarkets/.local/prover/program-candidate.json
            LNMarkets/.local/prover/execution.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
