[package]
name = "lnm-bitvm3-nova"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "LN Markets co-signed DLC batch state folding experiment on BitVM3/Nova"

[workspace]

[dependencies]
lnm-batch-statement = { path = "../statement" }
m18-utxo-window = { path = "../../integrations/bitvm3-nova/m18" }
nova-snark = "=0.76.0"
ff = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
hex = "0.4"
bincode = "1.3"

[profile.release]
debug = false
panic = "unwind"

[[bin]]
name = "lnm-nova"
path = "src/bin/lnm-nova.rs"
