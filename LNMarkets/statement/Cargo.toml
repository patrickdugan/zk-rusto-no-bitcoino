[package]
name = "lnm-batch-statement"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Bounded co-signed LN Markets batch proposal statement shared by native validation and a zkVM guest"

[workspace]

[features]
default = ["native"]
native = []

[dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
bitcoin = { version = "=0.32.7", default-features = false, features = ["std"] }

[[bin]]
name = "lnm-native"
path = "src/bin/lnm-native.rs"
required-features = ["native"]
