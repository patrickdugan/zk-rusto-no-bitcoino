[package]
name = "lnm-sp1-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[features]
default = []
resumable = ["dep:nb3-prover"]

[[bin]]
name = "lnm-sp1-host"
path = "src/main.rs"

[[bin]]
name = "lnm-nb3-prove"
path = "src/bin/lnm-nb3-prove.rs"
required-features = ["resumable"]

[dependencies]
anyhow = "=1.0.104"
bincode = "=1.3.3"
hex = "=0.4.3"
lnm-batch-statement = { path = "../../statement", default-features = false }
nb3-prover = { path = "../../../integrations/bitvm3-nova/prover", optional = true }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.9.0", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

# There is deliberately no build.rs. Every operation takes an external ELF.
[workspace]

[profile.release]
overflow-checks = true
