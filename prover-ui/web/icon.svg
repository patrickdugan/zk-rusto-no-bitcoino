  <polyline points="50,4.5 55,4.5 59.5,9 59.5,14" stroke="#F4F6FA" stroke-opacity="0.82" stroke-width="0.8"/>
  <polyline points="59.5,50 59.5,55 55,59.5 50,59.5" stroke="#F4F6FA" stroke-opacity="0.82" stroke-width="0.8"/>
