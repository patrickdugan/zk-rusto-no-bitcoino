    <polygon points="51.2,55.5 52.9,55.5 51.7,58.2 50.0,58.2" fill="#FF1E2B"/>
    <polygon points="53.9,55.5 55.6,55.5 54.4,58.2 52.7,58.2" fill="#FF1E2B"/>
