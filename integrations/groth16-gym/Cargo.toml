[package]
name = "groth16-gym"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "BN254 Groth16 circuits for Bitcoin SPV payments and header chains, with a memory/time bench"

[dependencies]
ark-bn254 = { version = "0.5.0", features = ["curve", "scalar_field"], default-features = false }
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-groth16 = { version = "0.5.0", features = ["parallel"] }
ark-snark = "0.5.1"
ark-relations = "0.5.1"
ark-r1cs-std = { version = "0.5.0", features = ["parallel"] }
ark-crypto-primitives = { version = "0.5.0", features = ["crh", "r1cs", "parallel"] }
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["parallel", "std"] }
bitcoin = "0.32"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
debug = false

[profile.test]
opt-level = 3

# A separately compiled benchmark crate.
[workspace]
