[package]
name = "m17-nova-script"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bitcoin Script (legacy, P2SH, witness v0) as a Nova step circuit, ported from Shinigami's engine"

[dependencies]
nova-snark = "=0.76.0"
ff = "0.13"
generic-array = "1.2"
sha2 = "0.10"
sha1 = "0.10"
ripemd = "0.1"
secp256k1 = "0.29"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
debug = false

[profile.test]
opt-level = 3

[[bin]]
name = "nova-script"
path = "src/main.rs"

[workspace]
