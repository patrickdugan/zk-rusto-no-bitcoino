[package]
name = "nb3-prover-gpu"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "nb3-prover over SP1 6.9's CUDA shard provers, sized for GPUs below SP1's 24 GB floor"

[[bin]]
name = "nb3-prove-gpu"
path = "src/main.rs"

[dependencies]
nb3-prover = { path = "../prover" }
sp1-gpu-prover = { git = "https://github.com/succinctlabs/sp1", rev = "b8387fa61e1361d90ee7de49f551863418ca0f08" }
sp1-gpu-cudart = { git = "https://github.com/succinctlabs/sp1", rev = "b8387fa61e1361d90ee7de49f551863418ca0f08" }
sp1-prover = "=6.9.0"
sp1-hypercube = "=6.9.0"
sp1-core-executor = "=6.9.0"
sp1-core-machine = "=6.9.0"
sp1-primitives = "=6.9.0"
anyhow = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

# SP1's GPU crates come from SP1's repository at the v6.9.0 commit and depend on its other crates
# by path; every SP1 crate from crates.io is taken from the same commit so the types unify.
[patch.crates-io]
slop-air = { git = "https://github.com/succinctlabs/sp1", rev = "b8387fa61e1361d90ee7de49f551863418ca0f08" }
