[package]
name = "babe-pilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
description = "BABE-inspired transparent Nova/Spartan input-label soldering pilot with Cut-and-Choose and Taproot enforcement"

[workspace]

[dependencies]
anyhow = "1"
bincode = "1.3"
bitcoin = { version = "0.32", features = ["rand-std"] }
blake3 = "1.5"
ff = "0.13"
garbled-snark-verifier = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "f9da9f8372d9608acefcb8c1f84c748e043ed596", default-features = false }
generic-array = "1.2"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
nova-snark = "=0.76.0"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }
zeroize = { version = "1", features = ["derive"] }

[profile.test]
opt-level = 3

[profile.release]
debug = false

[[bin]]
name = "babe-pilot-bench"
path = "src/bin/babe-pilot-bench.rs"
