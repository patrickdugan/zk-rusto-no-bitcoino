[package]
name = "m14-circuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
description = "M14: KoalaBear and degree-4 extension gadgets of the garbled BLAKE3 final verifier, checked against SP1's own field types"

[workspace]

[dependencies]
garbled-snark-verifier = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "8fa7efe495ea1bd4675f9c8bbd29f0b6e8bee051", default-features = false }
m12-gates = { path = "../../m12/gates" }

[dev-dependencies]
blake3 = "=1.8.2"
crossbeam = "0.8"
p3-field = "=0.4.3-succinct"
p3-koala-bear = "=0.4.3-succinct"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1.0"

[profile.test]
opt-level = 3
