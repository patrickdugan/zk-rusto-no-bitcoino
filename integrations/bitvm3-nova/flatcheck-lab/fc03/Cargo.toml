[package]
name = "flatcheck-fc03"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
description = "FC03: authenticated relaxed-R1CS row refutations for Nova folding instances, FlatMerkle vs Merkle openings, a garbled row-check circuit and a Bitcoin regtest dispute"

[workspace]

[dependencies]
nova-snark = "=0.76.0"
halo2curves = "=0.9.0"
ff = "0.13"
sha2 = { version = "0.10", features = ["compress"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
garbled-snark-verifier = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "8fa7efe495ea1bd4675f9c8bbd29f0b6e8bee051", default-features = false }
m12-gates = { path = "../../m12/gates" }
bitcoin = { version = "0.32", features = ["rand-std"] }
crossbeam = "0.8"

[profile.release]
debug = false

[profile.test]
opt-level = 3
