[package]
name = "m13-blake3-wrap"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "SP1 6.9.0 final recursion layer re-proved with BLAKE3 Merkle trees and transcript (no Poseidon2, no pairing)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "m13"
path = "src/bin/m13.rs"

[dependencies]
m13-verify = { path = "../verify" }
sp1-sdk = { version = "=6.9.0" }
sp1-prover = "=6.9.0"
sp1-hypercube = "=6.9.0"
sp1-primitives = "=6.9.0"
sp1-core-machine = "=6.9.0"
sp1-recursion-circuit = "=6.9.0"
sp1-recursion-compiler = "=6.9.0"
sp1-recursion-executor = "=6.9.0"
sp1-recursion-machine = "=6.9.0"
sp1-verifier = { version = "=6.9.0", default-features = false }
slop-algebra = "=6.9.0"
slop-challenger = "=6.9.0"
slop-symmetric = "=6.9.0"
slop-merkle-tree = "=6.9.0"
slop-stacked = "=6.9.0"
blake3 = "=1.8.2"
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
sp1-build = "=6.9.0"

[workspace]
