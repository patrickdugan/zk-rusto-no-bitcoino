[package]
name = "m13-verify"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Final-proof verifier for SP1 6.9.0's wrap layer re-proved with BLAKE3; BLAKE3 and KoalaBear operation counts"

[features]
# Read the operation counters of the patched p3-koala-bear (see opcount/patch_koala_bear.py).
opcount = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "m13-verify"
path = "src/bin/m13-verify.rs"

[dependencies]
sp1-hypercube = "=6.9.0"
sp1-primitives = "=6.9.0"
sp1-recursion-machine = { version = "=6.9.0", default-features = false }
sp1-recursion-executor = { version = "=6.9.0", default-features = false }
sp1-verifier = { version = "=6.9.0", default-features = false, features = ["full"] }
slop-algebra = "=6.9.0"
slop-challenger = "=6.9.0"
slop-symmetric = "=6.9.0"
p3-koala-bear = "=0.4.3-succinct"
blake3 = "=1.8.2"
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[profile.test]
opt-level = 3

[workspace]
