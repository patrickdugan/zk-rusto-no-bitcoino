[package]
name = "m12-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
garbled-snark-verifier = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "af374b4a5bb5a805ecaea749c61ff446986e8f10", default-features = false }
num-bigint = "0.4"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1.0"
sha2 = { version = "0.10", features = ["compress"] }
sha3 = "=0.10.9"
blake3 = "1.6.1"
