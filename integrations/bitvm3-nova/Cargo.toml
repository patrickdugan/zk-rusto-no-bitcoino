[package]
name = "nova-bitvm3-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"

[workspace]

[features]
default = []
native-reference = ["dep:nova-snark", "dep:ff", "dep:bincode", "dep:sha2", "dep:sha3", "dep:serde"]
curve-reference = ["dep:halo2curves", "dep:ff"]

[dependencies]
garbled-snark-verifier = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "8fa7efe495ea1bd4675f9c8bbd29f0b6e8bee051", default-features = false }
num-bigint = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1.0"
nova-snark = { version = "=0.76.0", optional = true }
halo2curves = { version = "=0.9.0", optional = true }
ff = { version = "0.13", optional = true }
bincode = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "=0.10.9", optional = true }

[[bin]]
name = "nova-reference"
path = "src/bin/nova_reference.rs"
required-features = ["native-reference"]
