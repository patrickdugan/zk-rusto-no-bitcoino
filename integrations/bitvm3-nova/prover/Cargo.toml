[package]
name = "nb3-prover"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Resumable, memory-bounded SP1 6.9 compressed proving on a single machine"

[[bin]]
name = "nb3-prove"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.9.0" }
sp1-prover = "=6.9.0"
sp1-prover-types = "=6.9.0"
sp1-core-executor = "=6.9.0"
sp1-core-machine = "=6.9.0"
sp1-hypercube = "=6.9.0"
sp1-primitives = "=6.9.0"
slop-algebra = "=6.9.0"
anyhow = "1.0"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "fs", "sync", "time"] }
tracing = "0.1"

[workspace]
