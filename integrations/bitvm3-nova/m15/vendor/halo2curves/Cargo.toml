[features]
asm = [
    "halo2derive/asm",
    "std",
]
bits = ["ff/bits"]
bn256-table = []
default = ["bits"]
derive_serde = [
    "serde/derive",
    "serde_arrays",
    "hex",
]
# nova-bitvm3 M15: affine points serialize uncompressed (x, y), decoded with an on-curve
# check and no square root. `raw-affine-serde` always; `raw-affine-serde-switch` at runtime
# (`serde::set_raw_affine_serde`), for a host that converts between the two encodings.
raw-affine-serde = []
raw-affine-serde-switch = []
print-trace = ["ark-std/print-trace"]
std = [
    "rayon",
    "halo2derive/std",
    "plonky2_maybe_rayon/parallel",
]

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dev-dependencies.getrandom]
version = "0.2"
