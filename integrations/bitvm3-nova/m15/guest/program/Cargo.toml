[package]
name = "m15-nova-wrapper-program"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
sp1-zkvm = { version = "=6.9.0", features = ["lib"] }
nova-snark = { version = "=0.76.0", default-features = false }
halo2curves = { version = "0.9.0", features = ["raw-affine-serde-switch"] }
ff = "0.13"
bincode = "=1.3.3"
sha2 = "=0.10.9"

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.2.0" }
halo2curves = { path = "../../vendor/halo2curves" }

[workspace]

[profile.release]
strip = "symbols"
