[package]
name = "m18-utxo-window"
version = "0.1.0"
edition = "2021"
publish = false
description = "A windowed UTXO map (indexed Merkle tree, Poseidon) for Nova balance proofs: native reference and cost model"

[dependencies]
nova-snark = "=0.76.0"
ff = "0.13"
generic-array = "1.2"
sha2 = { version = "0.10", features = ["compress"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
debug = false

[profile.test]
opt-level = 3

[[bin]]
name = "m18"
path = "src/main.rs"

[workspace]
