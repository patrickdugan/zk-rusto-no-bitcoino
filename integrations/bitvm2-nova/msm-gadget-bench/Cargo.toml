[package]
name = "bitvm2-nova-msm-gadget-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "msm_gadget_bench"
path = "src/main.rs"

[dependencies]
nova-snark = "=0.76.0"
halo2curves = { version = "0.9.0", features = ["std"] }
ff = "0.13.0"
group = "0.13"
num-bigint = "0.4.6"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
