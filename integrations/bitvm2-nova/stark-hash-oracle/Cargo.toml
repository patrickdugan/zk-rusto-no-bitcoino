[package]
name = "bitvm2-nova-stark-hash-oracle"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "stark_hash_cost"

[workspace]

[[bin]]
name = "stark_hash_cost"
path = "src/main.rs"

[dependencies]
bitvm = { git = "https://github.com/BitVM/BitVM", rev = "c620dbfaacebdf778e765a6681985350389973b1" }
bitcoin-scriptexec = { git = "https://github.com/BitVM/rust-bitcoin-scriptexec", rev = "ba96bc2bd76774c9d1b011461cb79d983c2c43a1" }
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script" }
bitcoin-script-stack = { git = "https://github.com/BitVM/rust-bitcoin-script-stack" }
bitcoin = "0.32.5"
blake3 = "1.6.1"
serde_json = "1"
hex = "0.4"
