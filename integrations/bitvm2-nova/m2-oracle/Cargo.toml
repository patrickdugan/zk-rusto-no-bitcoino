[package]
name = "bitvm2-nova-m2-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bitcoin-scriptexec = { git = "https://github.com/BitVM/rust-bitcoin-scriptexec", rev = "ba96bc2bd76774c9d1b011461cb79d983c2c43a1" }
bitcoin = "0.32.5"
halo2curves = { version = "=0.9.0", default-features = false, features = ["std"] }
ff = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
