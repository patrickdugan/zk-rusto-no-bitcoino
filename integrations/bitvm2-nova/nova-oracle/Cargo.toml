[package]
name = "bitvm2-nova-production-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Compile/run only in bounded hosted CI, never on the RAM-constrained host.
[workspace]

[dependencies]
nova-snark = "=0.76.0"
nova-header-chain = { git = "https://github.com/patrickdugan/zk-rusto-no-bitcoino", rev = "de607d3db17d400dd6c2923d357f1d4a7bf233c7" }
ff = "0.13"
halo2curves = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "=1.3.3"
sha2 = "0.10"
