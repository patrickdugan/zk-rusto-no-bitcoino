[package]
name = "bitvm2-nova-auth-cost-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "auth_cost"
path = "src/main.rs"

[dependencies]
bitvm2-nova-script-oracle = { path = "../rust-oracle" }
bitvm = { git = "https://github.com/BitVM/BitVM", rev = "c620dbfaacebdf778e765a6681985350389973b1" }
bitcoin-scriptexec = { git = "https://github.com/BitVM/rust-bitcoin-scriptexec", rev = "ba96bc2bd76774c9d1b011461cb79d983c2c43a1" }
bitcoin = "0.32.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
