[package]
name = "ark-transition-nova"
version = "0.1.0"
edition = "2021"
publish = false
description = "Nova proof of Ark transaction-graph accounting: value conservation, fee bound, single-use spend identities"

[dependencies]
nova-snark = "=0.76.0"
ff = "0.13"
generic-array = "1.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
debug = false

[profile.test]
opt-level = 3

[lib]
name = "ark_transition_nova"
path = "src/lib.rs"

[[bin]]
name = "ark-nova"
path = "src/main.rs"

[workspace]
